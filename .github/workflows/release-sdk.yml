# Publishes @mini-cloud/shared and @mini-cloud/reporter to npmjs.org.
#
# Triggered by a version tag, not by a merge: a release should be a deliberate act
# with a name, and a tag is the record of exactly what shipped. `main` moving does
# not publish anything.
#
# Authentication is npm Trusted Publishing over GitHub's OIDC, so there is no
# NPM_TOKEN in this repository. GitHub mints a short-lived token that npm exchanges
# for publish rights, scoped to this repo and to THIS FILENAME. Renaming this file
# breaks publishing until both packages' trusted publisher entries on npmjs.com name
# the new one — the failure is at the publish step, after the build and tests have
# passed, on a tag that has already been pushed.
#
# This file was `publish.yml` until it was renamed to sit beside release-cli.yml, so
# the entries for @mini-cloud/shared and @mini-cloud/reporter each need
# `release-sdk.yml` under Package → Settings → Trusted publishing.
#
# One consequence worth knowing: npm generates provenance attestations automatically
# under trusted publishing, so `--provenance` is deliberately absent below. Passing it
# is not needed and only adds a way to be wrong.
name: Release SDK
on:
  push:
    tags:
      - 'sdk-v*'
permissions:
  # The whole of the authentication story. Without it npm has no OIDC token to trade.
  id-token: write
  contents: read
concurrency:
  # One release at a time. Two tags pushed together would otherwise race to publish the
  # same package, and `cancel-in-progress` is deliberately absent: cancelling a job
  # halfway through a publish is how one package ships and the other does not.
  group: release-sdk
  cancel-in-progress: false
jobs:
  publish:
    name: Build, Test, Publish
    runs-on: ubuntu-latest
    # A GitHub Environment, for the one step in this repository that cannot be undone.
    # It does two things: with a required reviewer it holds the run at the publish job
    # until someone approves, and it puts an `environment` claim in the OIDC token that
    # npm's trusted publisher can be configured to insist on — so a token minted by any
    # other job in this repository is refused.
    #
    # Referencing an environment that does not exist creates it, with no rules, so this
    # line alone gates nothing: the approval comes from adding a required reviewer under
    # Settings → Environments → npm-publish.
    environment: npm-publish
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node 22.14.0 or newer; `22` resolves to the
          # latest 22.x, which is well past that.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # Caching is deliberately off. A release build should resolve everything
          # from the registry rather than from whatever a previous run left behind.

      - name: Upgrade npm
        # Node 22 bundles npm 10.x, which has no OIDC support at all — publishing
        # would fail asking for a token. Trusted publishing needs 11.5.1 or newer.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the package versions
        # A tag that disagrees with package.json publishes a version nobody asked
        # for, under a tag that then points at the wrong thing. Fail before the
        # irreversible step rather than after it.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          STATUS=0
          for package in shared reporter; do
            PACKAGE_VERSION="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::packages/${package} is at ${PACKAGE_VERSION}, but the tag says ${TAG_VERSION}."
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Build
        run: npm run build

      - name: Test
        # A publish cannot be taken back after 72 hours, so the same gate the pull
        # request had applies again to the exact commit being shipped.
        run: npm test

      - name: Publish @mini-cloud/shared
        # First, because @mini-cloud/reporter depends on it. npm does not check that
        # a dependency resolves at publish time, so the wrong order would leave a
        # window in which `npm install @mini-cloud/reporter` fails.
        run: npm publish --workspace @mini-cloud/shared

      - name: Publish @mini-cloud/reporter
        run: npm publish --workspace @mini-cloud/reporter
