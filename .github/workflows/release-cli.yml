# Builds the self-contained `mini-cloud` binary for macOS and Linux, publishes it to the
# downloads bucket behind https://mini-cloud.qinnan.dev/downloads/cli/, and attaches it
# to a GitHub Release.
#
# The bucket and the role this assumes are in infra/; the role trusts `cli-v*` tags of
# this repository and nothing else. Two repository secrets, both stack outputs:
# AWS_RELEASE_ROLE_ARN and DOWNLOADS_BUCKET.
#
# A separate tag from release-sdk.yml's `sdk-v*`: a CLI fix is not a reason to republish
# a library, and a library release is not a reason to rebuild three binaries.
name: Release CLI
on:
  push:
    tags:
      - 'cli-v*'
  # Buildable without shipping, to prove a pipeline change without pushing a tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the binaries (no release is published)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: read

env:
  DOWNLOADS_URL: https://mini-cloud.qinnan.dev/downloads/cli

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            # refs/tags/cli-v1.2.3 -> 1.2.3
            version="${GITHUB_REF#refs/tags/cli-v}"
          fi
          # Refused here rather than discovered later: this string is stamped into the
          # binary and published as the manifest every installed CLI polls, and one the
          # updater cannot parse — `cli-v1.2`, `cli-vtest` — breaks `mini-cloud update`
          # on every machine until a well-formed tag replaces it.
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::\"$version\" is not a MAJOR.MINOR.PATCH version; tag it as cli-v1.2.3 or cli-v1.2.3-rc.1"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # `1.3.0-rc.1` is published, but does not become the version everyone installs.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          # No darwin-x64: GitHub retired the macos-13 runner in December 2025, and its
          # remaining Intel image, macos-15-intel, goes the same way in August 2027.
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The binary IS this Node: the build copies the runner's executable.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp the version
        run: npm pkg set version="${{ needs.version.outputs.version }}" --workspace @mini-cloud/cli

      # The bundle resolves @mini-cloud/* from their compiled dist, so this comes first.
      - name: Build the workspace
        run: npm run build

      # Unsigned on macOS: see md/TODO.md for what signing would take.
      - name: Build the binary
        run: npm run ${{ startsWith(matrix.target, 'darwin') && 'build:sea:mac' || 'build:sea:linux' }} --workspace @mini-cloud/cli

      - name: Check it runs
        run: |
          cd packages/cli/build/sea
          ./mini-cloud --help > /dev/null
          ./mini-cloud daemon status
          ./mini-cloud agent daemon status

          # The version has to be the one stamped above, not whatever was compiled in
          # last: a binary reporting the wrong version cannot be traced to a release.
          got="$(./mini-cloud --version)"
          [ "$got" = "${{ needs.version.outputs.version }}" ] || {
            echo "::error::binary reports $got, expected ${{ needs.version.outputs.version }}"
            exit 1
          }

          # The migrations have to be inside it. If the bundler's onResolve filter stops
          # matching, EMBEDDED_MIGRATIONS stays empty and the binary silently falls back
          # to reading a directory that does not exist next to it — which every command
          # here survives, and the first `serve` against a real database does not.
          # `-a`: BSD grep treats the binary as unmatched without it and GNU grep does
          # not, so this check would pass on the Linux runners and fail on the macOS ones.
          grep -q -a '001_initial.sql' mini-cloud || {
            echo '::error::no migrations compiled into the binary — check the embed-migrations plugin'
            exit 1
          }

      - name: Package the tarball
        run: |
          cd packages/cli/build/sea
          tar -czf "mini-cloud-${{ matrix.target }}.tar.gz" mini-cloud

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          retention-days: 1
          path: packages/cli/build/sea/*.tar.gz

  release:
    name: Publish the release
    needs: [version, build]
    # A dispatch run builds and verifies but ships nothing: there is no tag.
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packages/cli/scripts/install.sh
          sparse-checkout-cone-mode: false

      - name: Collect the builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble the release directory
        run: |
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          # The only way to tell that a downloaded, unsigned binary is what CI built.
          sha256sum *.tar.gz > SHA256SUMS
          cp ../packages/cli/scripts/install.sh .
          ls -la
          # One line: install.sh reads it with sed.
          printf '{"version":"%s","publishedAt":"%s"}\n' "${{ needs.version.outputs.version }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../version.json

      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to the downloads bucket
        env:
          BUCKET: ${{ secrets.DOWNLOADS_BUCKET }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          prefix="s3://$BUCKET/downloads/cli"
          # A version's directory is never rewritten, so it can be cached for good.
          immutable='public, max-age=31536000, immutable'
          # text/plain, so a browser shows the script to anyone reading it before piping it to sh.
          script='text/plain; charset=utf-8'

          # What makes `immutable` true. Re-running a tag over a directory that already
          # has objects would leave edges and installs holding a year-old copy of files
          # this run replaced — a new SHA256SUMS against an old tarball reads as
          # tampering. A retag after a partly-failed publish needs a new version.
          if [ -n "$(aws s3 ls "$prefix/v$VERSION/")" ]; then
            echo "::error::v$VERSION is already published; releases are immutable, so tag the fix as a new version"
            exit 1
          fi

          aws s3 cp release/ "$prefix/v$VERSION/" --recursive --exclude install.sh --cache-control "$immutable"
          aws s3 cp release/install.sh "$prefix/v$VERSION/install.sh" --cache-control "$immutable" --content-type "$script"

          if [ "$PRERELEASE" = true ]; then
            echo "A prerelease: published under v$VERSION/ only, and the latest release is unchanged."
            exit 0
          fi

          # The two files naming the latest release are revalidated on every request, so
          # a release needs no invalidation. The manifest goes last, so it never names a
          # version whose files are not up yet.
          aws s3 cp release/install.sh "$prefix/install.sh" --cache-control no-cache --content-type "$script"
          aws s3 cp version.json "$prefix/version.json" --cache-control no-cache --content-type application/json

          # Proves the manifest this workflow just wrote is what $DOWNLOADS_URL serves:
          # that the bucket is behind that domain, that the behavior routes to it, and
          # that no cache is holding the previous release. A bare fetch would pass
          # against any manifest, including one on somebody else's domain.
          served="$(curl -fsS "$DOWNLOADS_URL/version.json" | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p')"
          [ "$served" = "$VERSION" ] || {
            echo "::error::$DOWNLOADS_URL/version.json serves \"$served\", not $VERSION"
            exit 1
          }

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Self-contained `mini-cloud` binaries for macOS on Apple silicon and Linux on
            x64 and arm64. No Node, no `npm install`, no checkout — the CLI, the control
            plane, the agent and the database migrations are all inside the executable.

            Install the latest release, or update to it:

            ```bash
            curl -fsSL ${{ env.DOWNLOADS_URL }}/install.sh | sh
            ```

            This one in particular:

            ```bash
            curl -fsSL ${{ env.DOWNLOADS_URL }}/install.sh | MINI_CLOUD_VERSION=${{ needs.version.outputs.version }} sh
            ```

            The installer checks the download against `SHA256SUMS`, keeps each version in
            `~/.local/share/mini-cloud/versions/`, and points `~/.local/bin/mini-cloud` at
            the new one. From then on, `mini-cloud update` does the same.

            To download a binary by hand instead, use `curl`, not the browser:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mini-cloud-darwin-arm64.tar.gz | tar -xz
            ./mini-cloud --help
            ```

            That is not a style preference. macOS attaches a quarantine attribute to
            anything a **browser** downloads, and these binaries are ad-hoc signed rather
            than notarized, so Gatekeeper refuses a quarantined copy. `curl` sets no such
            attribute and the binary runs immediately. If you did download it in a
            browser, clear it by hand:

            ```bash
            xattr -d com.apple.quarantine ./mini-cloud
            ```

            Verify what you downloaded against `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```
