# Runs on a pull request, and again on main once one lands.
#
# The second trigger is not redundant. `main` only accepts squash merges, so a merge
# produces a commit that has never existed before — a new tree with a new SHA that no
# CI run has ever seen. A branch can be green and the squashed result still broken,
# most often when two PRs each pass alone and conflict semantically once combined.
name: Build & Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
concurrency:
  # Per branch, so a second push supersedes the first rather than running both. Safe to
  # cancel here in a way a release is not: nothing this workflow does leaves a trace.
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_test:
    name: Node.js 22 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:lint
