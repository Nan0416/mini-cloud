name: PR Build & Test
on:
  pull_request:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  build_and_test:
    name: Node.js 22 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:lint
